<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pathly bean avatar studio</title>
<style>
:root{font-family:ui-rounded,system-ui,sans-serif;color:#242728;background:#f7f6f2;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:40px 24px}h1{font-size:34px;letter-spacing:-1px;margin:4px 0 10px}p{line-height:1.5;color:#565b58}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:750;color:#547b53}.layout{display:grid;grid-template-columns:320px 1fr;gap:28px;margin:28px 0}.panel{padding:24px;border-radius:24px;background:white;border:1px solid #e1e4dc}.preview{text-align:center;position:sticky;top:24px;align-self:start}#hero svg{width:220px;height:220px}.sizes{display:flex;align-items:center;justify-content:center;gap:20px;min-height:90px}.sample{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#656962}.sample svg{display:block}.dark{background:#202826;border-radius:14px;padding:10px;display:flex;justify-content:center;gap:16px}.dark svg{width:40px;height:40px}button{font:inherit;cursor:pointer;border:1px solid #dde1d9;border-radius:12px;background:#fff;color:#242728;min-height:44px}button:focus-visible{outline:3px solid #347c61;outline-offset:3px}button[aria-pressed="true"]{border:2px solid #34664d;background:#edf4eb}h2{font-size:17px;margin:0 0 14px}section+section{margin-top:26px}.options{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.option{padding:5px 2px 8px;font-size:10px;line-height:1.15;min-width:0}.option svg{display:block;width:58px;height:58px;margin:auto}.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.swatch{padding:7px 2px;font-size:10px}.swatch span{display:block;margin:0 auto 5px;width:28px;height:28px;border-radius:50%;border:1px solid #0001}.actions{display:grid;gap:10px;margin-top:22px}.primary{background:#315d45;color:white;padding:10px 14px;border:0}.secondary{padding:10px 14px}.preset-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.preset{padding:12px 6px;font-size:12px}.preset svg{width:100%;max-width:112px;display:block;margin:auto}.note{font-size:12px}.status{min-height:20px;font-size:12px;color:#315d45}footer{margin:24px 0;font-size:12px;color:#656962}@media(max-width:760px){main{padding:24px 14px}.layout{grid-template-columns:1fr}.preview{position:static}.options{grid-template-columns:repeat(4,1fr)}.preset-grid{grid-template-columns:repeat(3,1fr)}#hero svg{height:160px;width:160px}}
#hero{animation:bean-idle 3s ease-in-out infinite;transform-origin:50% 65%}
@keyframes bean-idle{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-5.5px) rotate(1.5deg)}}
@media(prefers-reduced-motion:reduce){#hero{animation:none}}
#shuffle{min-height:44px;padding:10px 20px;border-radius:22px;margin:auto}
</style>
<main><h1>Your bean</h1>
<div class="layout"><aside class="panel preview"><div id="hero" role="img" aria-label="Your customized bean"></div><button class="primary" id="shuffle">Surprise me</button><div class="sizes" id="sizes"></div><div class="dark" id="dark" aria-label="Preview on a dark background"></div><div class="actions"><button class="secondary" id="download">Download SVG</button><button class="secondary" id="copy">Copy settings</button></div><p class="status" id="status" aria-live="polite"></p></aside>
<div class="panel"><section><h2>Bean color</h2><div class="swatches" id="colors"></div></section><section><h2>Eyes</h2><div class="options" id="eyes"></div></section><section><h2>Mouth</h2><div class="options" id="mouth"></div></section><section><h2>Hair</h2><div class="options" id="hair"></div></section></div></div>
<footer>Demo only · Changes aren’t saved to your account.</footer></main>
<script>
/** Stable IDs are saved in a user's profile; artwork can evolve without migrating profiles. */
const BEAN_COLORS = [
    { id: 'sage', label: 'Sage', hex: '#A6BD83' },
    { id: 'coral', label: 'Coral', hex: '#FF8074' },
    { id: 'lavender', label: 'Lavender', hex: '#B5A0EA' },
    { id: 'gold', label: 'Gold', hex: '#F9C543' },
    { id: 'sky', label: 'Sky', hex: '#78BEF5' },
    { id: 'peach', label: 'Peach', hex: '#FFAE8B' },
    { id: 'teal', label: 'Teal', hex: '#64C4B7' },
    { id: 'pink', label: 'Pink', hex: '#F593BC' },
    { id: 'lime', label: 'Lime', hex: '#C4D975' },
    { id: 'periwinkle', label: 'Periwinkle', hex: '#96A7ED' },
    { id: 'clay', label: 'Clay', hex: '#DDA18B' },
    { id: 'oat', label: 'Oat', hex: '#DFD3B6' },
];
const INK = '#242728';
const WHITE = '#FFFFFF';
const circle = (x, y, r, fill = INK) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}"/>`;
const line = (d, width = 6) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${width}" stroke-linecap="round" stroke-linejoin="round"/>`;
const shape = (d, fill = INK) => `<path d="${d}" fill="${fill}"/>`;
/** Every part uses the same 128 x 128 coordinates, including safe space for hair. */
const BEAN_EYES = [
    { id: 'dots', label: 'Just here', svg: circle(51, 61, 4) + circle(79, 61, 4) },
    { id: 'wide', label: 'Seen things', svg: circle(49, 60, 14, WHITE) + circle(80, 60, 14, WHITE) + circle(51, 61, 5) + circle(78, 61, 5) },
    { id: 'sleepy', label: 'Five more minutes', svg: shape('M36 58H62A13 13 0 0 1 36 58M69 58H95A13 13 0 0 1 69 58', WHITE) + circle(49, 61, 4) + circle(82, 61, 4) + line('M36 57H62M69 57H95', 4) },
    { id: 'side-eye', label: 'Interesting...', svg: circle(49, 60, 13, WHITE) + circle(80, 60, 13, WHITE) + circle(43, 61, 5) + circle(74, 61, 5) },
    { id: 'uneven', label: 'Processing', svg: circle(49, 60, 15, WHITE) + circle(51, 61, 5) + circle(82, 61, 4) },
    { id: 'shades', label: 'Too cool', svg: '<rect x="29" y="46" width="33" height="26" rx="8" fill="' + INK + '"/><rect x="69" y="46" width="33" height="26" rx="8" fill="' + INK + '"/>' + line('M60 55H71', 6) },
    { id: 'squint', label: 'Not convinced', svg: line('M42 60H56M73 60H87', 7) },
    { id: 'wink', label: 'Got this', svg: circle(49, 60, 5) + line('M73 61Q80 53 87 61', 5) },
    { id: 'suspicious', label: 'Who sent you?', svg: circle(49, 64, 4) + circle(81, 64, 4) + line('M39 48L57 54M73 54L91 48', 6) },
    { id: 'happy', label: 'Good day', svg: line('M39 62Q49 47 59 62M71 62Q81 47 91 62', 5) },
    { id: 'tiny', label: 'No thoughts', svg: circle(53, 61, 2.5) + circle(77, 61, 2.5) },
    { id: 'upward', label: 'Daydreaming', svg: circle(49, 60, 13, WHITE) + circle(80, 60, 13, WHITE) + circle(49, 54, 5) + circle(80, 54, 5) },
];
const BEAN_MOUTHS = [
    { id: 'none', label: 'No comment', svg: '' },
    { id: 'flat', label: 'Unbothered', svg: line('M57 84H73', 5) },
    { id: 'smile', label: 'Little smile', svg: line('M54 79Q65 93 76 79', 5) },
    { id: 'smirk', label: 'Knows something', svg: line('M62 86Q74 86 77 78', 5) },
    { id: 'wobble', label: 'Doing my best', svg: line('M52 84Q58 76 64 84T77 84', 5) },
    { id: 'yawn', label: 'Big yawn', svg: '<ellipse cx="65" cy="87" rx="10" ry="15" fill="' + INK + '"/>' },
    { id: 'tooth', label: 'One tooth', svg: line('M52 79H78', 5) + '<rect x="60" y="80" width="11" height="13" rx="2" fill="' + WHITE + '"/>' },
    { id: 'grin', label: 'Suspiciously pleased', svg: shape('M49 78H81Q78 96 65 96Q52 96 49 78Z') + shape('M53 80H77L75 85H55Z', WHITE) },
    { id: 'oh', label: 'Oh.', svg: circle(65, 85, 6) },
    { id: 'frown', label: 'Missed the train', svg: line('M55 88Q65 76 75 88', 5) },
    { id: 'tongue', label: 'Being normal', svg: shape('M52 78H78Q77 91 65 91Q54 91 52 78Z') + shape('M64 84H73V91Q73 98 68 98Q64 98 64 91Z', '#E66E8A') },
    { id: 'mustache', label: 'Very official', svg: shape('M65 80C57 71 49 84 41 83C36 82 36 78 39 76C28 76 32 94 44 93C54 93 60 89 65 85C70 89 76 93 86 93C98 94 102 76 91 76C94 78 94 82 89 83C81 84 73 71 65 80Z') },
];
const BEAN_HAIR = [
    { id: 'none', label: 'Bald and bold', svg: '' },
    { id: 'three', label: 'Three whole hairs', svg: line('M65 29L62 15M75 27L77 12M85 29L92 16', 6) },
    { id: 'curl', label: 'One good curl', svg: line('M72 29C56 18 66 7 75 12C83 17 73 23 70 17', 5) },
    { id: 'tufts', label: 'Bedhead', svg: shape('M70 31Q54 7 67 11Q73 15 73 27Q80 9 90 14Q94 19 78 32Z') },
    { id: 'comb-over', label: 'Carefully arranged', svg: line('M60 30Q67 14 87 18M69 31Q78 21 91 25', 5) },
    { id: 'zigzag', label: 'Static situation', svg: line('M58 29L64 16L72 27L80 13L88 26', 5) },
    { id: 'sprout', label: 'Personal growth', svg: line('M75 30V19', 4) + shape('M75 22Q56 22 59 10Q75 9 75 22M75 22Q75 7 90 10Q92 22 75 22Z') },
    { id: 'swoop', label: 'Main character', svg: shape('M56 31Q60 9 91 16Q88 29 74 28Q82 23 82 21Q65 22 56 31Z') },
    { id: 'spikes', label: 'On edge', svg: shape('M54 31L58 15L67 25L75 10L81 25L92 16L91 35Z') },
    { id: 'antenna', label: 'Receiving signals', svg: line('M75 28L79 13', 4) + circle(80, 10, 4) },
];
const DEFAULT_BEAN_AVATAR = {
    version: 1, color: 'sage', eyes: 'wide', mouth: 'flat', hair: 'none',
};
/** Reject unknown versions; salvage valid individual fields from incomplete/corrupt data. */
function normalizeBeanAvatar(value) {
    const fallback = { ...DEFAULT_BEAN_AVATAR };
    if (!value || typeof value !== 'object' || Array.isArray(value))
        return fallback;
    const input = value;
    if (input.version !== 1)
        return fallback;
    return {
        version: 1,
        color: BEAN_COLORS.find((part) => part.id === input.color)?.id ?? fallback.color,
        eyes: BEAN_EYES.find((part) => part.id === input.eyes)?.id ?? fallback.eyes,
        mouth: BEAN_MOUTHS.find((part) => part.id === input.mouth)?.id ?? fallback.mouth,
        hair: BEAN_HAIR.find((part) => part.id === input.hair)?.id ?? fallback.hair,
    };
}
const BEAN_BODY_PATH = 'M76 27C96 27 108 43 108 64C108 94 87 115 59 115C36 115 23 102 23 85C23 70 34 65 39 53C44 39 52 27 76 27Z';
/** Transparent, self-contained SVG. No remote images, embedded fonts, IDs, or user markup. */
function beanAvatarSvg(value = DEFAULT_BEAN_AVATAR) {
    const config = normalizeBeanAvatar(value);
    const color = BEAN_COLORS.find((part) => part.id === config.color);
    const eyes = BEAN_EYES.find((part) => part.id === config.eyes);
    const mouth = BEAN_MOUTHS.find((part) => part.id === config.mouth);
    const hair = BEAN_HAIR.find((part) => part.id === config.hair);
    return `<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">${shape(BEAN_BODY_PATH, color.hex)}${eyes.svg}${mouth.svg}${hair.svg}</svg>`;
}
function randomBeanAvatar() {
    const choose = (options) => options[Math.floor(Math.random() * options.length)];
    return { version: 1, color: choose(BEAN_COLORS).id, eyes: choose(BEAN_EYES).id, mouth: choose(BEAN_MOUTHS).id, hair: choose(BEAN_HAIR).id };
}
const BEAN_PRESETS = [
    { id: 'stare', label: 'The stare', config: { version: 1, color: 'sage', eyes: 'wide', mouth: 'flat', hair: 'none' } },
    { id: 'sleepy', label: 'Not a morning bean', config: { version: 1, color: 'coral', eyes: 'sleepy', mouth: 'tooth', hair: 'none' } },
    { id: 'frazzled', label: 'Holding it together', config: { version: 1, color: 'lavender', eyes: 'dots', mouth: 'wobble', hair: 'three' } },
    { id: 'cool', label: 'Too cool', config: { version: 1, color: 'gold', eyes: 'shades', mouth: 'flat', hair: 'none' } },
    { id: 'processing', label: 'Still processing', config: { version: 1, color: 'sky', eyes: 'uneven', mouth: 'flat', hair: 'curl' } },
    { id: 'yawn', label: 'Express nap', config: { version: 1, color: 'peach', eyes: 'tiny', mouth: 'yawn', hair: 'none' } },
    { id: 'official', label: 'Very official', config: { version: 1, color: 'teal', eyes: 'dots', mouth: 'mustache', hair: 'comb-over' } },
    { id: 'growth', label: 'Working on myself', config: { version: 1, color: 'pink', eyes: 'side-eye', mouth: 'smirk', hair: 'sprout' } },
    { id: 'suspicious', label: 'Trust issues', config: { version: 1, color: 'lime', eyes: 'suspicious', mouth: 'oh', hair: 'none' } },
    { id: 'signal', label: 'Looking for service', config: { version: 1, color: 'periwinkle', eyes: 'upward', mouth: 'none', hair: 'antenna' } },
    { id: 'bedhead', label: 'Just woke up', config: { version: 1, color: 'clay', eyes: 'squint', mouth: 'tongue', hair: 'tufts' } },
    { id: 'optimist', label: 'Made the train', config: { version: 1, color: 'oat', eyes: 'happy', mouth: 'grin', hair: 'swoop' } },
];

let current = randomBeanAvatar();
const el = (id) => document.getElementById(id);
function button(label, contents, action, selected, className){const b=document.createElement('button');b.type='button';b.className=className;b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',String(selected));b.innerHTML=contents;b.onclick=action;return b;}
function render(){
 el('hero').innerHTML=beanAvatarSvg(current);
 el('sizes').innerHTML=[24,32,48,64].map(size=>'<div class="sample">'+beanAvatarSvg(current).replace('width="128" height="128"','width="'+size+'" height="'+size+'"')+'<span>'+size+' px</span></div>').join('');
 el('dark').innerHTML=beanAvatarSvg(current)+beanAvatarSvg({...current,color:'oat'});
 el('colors').replaceChildren(...BEAN_COLORS.map(c=>button(c.label,'<span style="background:'+c.hex+'"></span>'+c.label,()=>{current.color=c.id;render()},current.color===c.id,'swatch')));
 for(const [field,parts] of [['eyes',BEAN_EYES],['mouth',BEAN_MOUTHS],['hair',BEAN_HAIR]]){
  el(field).replaceChildren(...parts.map(p=>{const config={...current,eyes:'dots',mouth:'none',hair:'none',[field]:p.id};return button(p.label,beanAvatarSvg(config),()=>{current[field]=p.id;render()},current[field]===p.id,'option')}));
 }
}
el('shuffle').onclick=()=>{current=randomBeanAvatar();render();el('status').textContent=''};
el('download').onclick=()=>{const url=URL.createObjectURL(new Blob([beanAvatarSvg(current)],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=url;a.download='pathly-bean.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);el('status').textContent='SVG downloaded.'};
el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(current,null,2));el('status').textContent='Avatar settings copied.'}catch{el('status').textContent='Clipboard unavailable. Your settings: '+JSON.stringify(current)}};
render();
</script></html>
